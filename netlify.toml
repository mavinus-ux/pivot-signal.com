# Netlify configuration for Pivot-Signal

[build]
  publish = "."

# Root redirect is now handled by an Edge Function (Accept-Language detection)
# See [[edge_functions]] block at the bottom of this file

# Pretty URLs
[[redirects]]
  from = "/all-eas"
  to = "/en/all-eas.html"
  status = 301

[[redirects]]
  from = "/custom-ea"
  to = "/en/custom-ea.html"
  status = 301

[[redirects]]
  from = "/expert-advisor"
  to = "/en/expert-advisor.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/en/about.html"
  status = 301

[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

# Security & Performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/imgs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Edge Function: language-aware redirect on root
# Must come AFTER [[redirects]] in the file to take effect
[[edge_functions]]
  path = "/"
  function = "redirect"
